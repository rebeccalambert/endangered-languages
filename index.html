<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe4" />
    <meta name="description" content="104 endangered languages, seen through different questions." />
    <title>Endangered languages</title>
  </head>
  <body>
    <header class="masthead">
      <h1 class="title" id="title"></h1>
      <p class="lede" id="lede"></p>
    </header>
    <main id="stage" class="stage"></main>
    <footer class="footer" id="footer"></footer>
    <div class="callout" id="callout" role="status" hidden>
      <p class="callout__text"></p>
      <button type="button" class="callout__close" aria-label="Dismiss">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav class="stepper" id="stepper">
      <ol class="stepper__strip"></ol>
      <div class="stepper__row">
        <button type="button" class="stepper__arrow" data-dir="-1" aria-label="Previous question"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <p class="stepper__question" aria-live="polite"></p>
        <button type="button" class="stepper__arrow" data-dir="1" aria-label="Next question"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </nav>
    <dialog class="panel" id="panel" aria-labelledby="panel-title">
      <button type="button" class="panel__close" aria-label="Close details">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="panel__body"></div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
